<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event — Sponsoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        .tier-card {
            background: var(--bg-page);
            border: 1.5px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 12px;
            position: relative;
        }

        .tier-card .remove-tier {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #FEE2E2;
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            cursor: pointer;
            border: none;
        }

        .perks-input {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .perks-input input {
            flex: 1;
        }

        .perk-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .perk-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            background: var(--green-light);
            color: var(--green);
            font-size: .78rem;
            font-weight: 600;
        }

        .perk-tag button {
            background: none;
            border: none;
            color: var(--green);
            cursor: pointer;
            font-size: .7rem;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <div id="sidebarContainer"></div>
        <div class="main-content">
            <div id="topbarContainer"></div>
            <div class="page-content">
                <h1 class="page-title">Create Event Listing</h1>
                <p class="page-subtitle">List your event and attract sponsors from across India.</p>
                <form id="eventForm">
                    <div class="form-card">
                        <h3><i class="fa-solid fa-circle-info" style="color:var(--primary);"></i> Basic Information</h3>
                        <div class="form-row">
                            <div class="form-group"><label>Event Name *</label><input type="text" id="eventName"
                                    placeholder="e.g. TechFest 2026" required></div>
                            <div class="form-group"><label>Event Type *</label>
                                <select id="eventType" required>
                                    <option value="">Select type</option>
                                    <option>Tech Fest</option>
                                    <option>Cultural Fest</option>
                                    <option>DJ Night</option>
                                    <option>Hackathon</option>
                                    <option>Sports</option>
                                    <option>Workshop</option>
                                    <option>Competition</option>
                                    <option>Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Event Date *</label><input type="date" id="eventDate"
                                    required></div>
                            <div class="form-group"><label>Venue *</label><input type="text" id="venue"
                                    placeholder="e.g. Main Auditorium" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Expected Footfall *</label><input type="number" id="footfall"
                                    placeholder="e.g. 5000" required></div>
                            <div class="form-group"><label>City</label><input type="text" id="city" value=""
                                    placeholder="Event city"></div>
                        </div>
                        <div class="form-group"><label>Target Audience</label><input type="text" id="targetAudience"
                                placeholder="e.g. Engineering Students, Tech Enthusiasts"></div>
                        <div class="form-group"><label>Event Description</label><textarea id="description"
                                placeholder="Describe your event, its history, and what makes it special..."></textarea>
                        </div>
                    </div>
                    <div class="form-card">
                        <h3><i class="fa-solid fa-tags" style="color:var(--purple);"></i> Sponsorship Tiers</h3>
                        <p style="font-size:.85rem;color:var(--text-secondary);margin-bottom:16px;">Define your
                            sponsorship packages. Add perks for each tier to attract the right sponsors.</p>
                        <div id="tiersContainer"></div>
                        <button type="button" class="btn-secondary" id="addTierBtn"><i class="fa-solid fa-plus"></i> Add
                            Tier</button>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn-primary"><i class="fa-solid fa-rocket"></i> Publish
                            Event</button>
                        <button type="button" class="btn-secondary" id="previewBtn"><i class="fa-solid fa-file-pdf"></i>
                            Preview Brochure</button>
                        <button type="button" class="btn-secondary"
                            onclick="showToast('Saved as draft!'); setTimeout(()=>window.location.href='/institution/dashboard.html',500)"><i
                                class="fa-solid fa-save"></i> Save Draft</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/shared.js"></script>
    <script>
        if (!Session.require('institution')) throw '';
        const user = Session.get();
        document.getElementById('sidebarContainer').innerHTML = renderSidebar('create-event');
        document.getElementById('topbarContainer').innerHTML = renderTopbar();
        initSidebarEvents();
        document.getElementById('city').value = user.city || '';
        let tiers = [];
        function renderTiers() {
            const c = document.getElementById('tiersContainer');
            c.innerHTML = tiers.map((t, i) => `
        <div class="tier-card">
          <button type="button" class="remove-tier" onclick="tiers.splice(${i},1);renderTiers();"><i class="fa-solid fa-xmark"></i></button>
          <div class="form-row">
            <div class="form-group"><label>Tier Name</label><input value="${t.name}" onchange="tiers[${i}].name=this.value" placeholder="e.g. Title Sponsor"></div>
            <div class="form-group"><label>Price (₹)</label><input value="${t.price}" onchange="tiers[${i}].price=this.value" placeholder="e.g. ₹5,00,000"></div>
          </div>
          <div class="form-group"><label>Perks</label>
            <div class="perks-input"><input id="perkInput${i}" placeholder="Type a perk and click Add"><button type="button" class="btn-secondary" style="padding:8px 14px;" onclick="addPerk(${i})">Add</button></div>
            <div class="perk-list">${t.perks.map((p, pi) => `<span class="perk-tag">${p}<button type="button" onclick="tiers[${i}].perks.splice(${pi},1);renderTiers();">×</button></span>`).join('')}</div>
          </div>
        </div>
      `).join('');
        }
        window.addPerk = function (i) {
            const inp = document.getElementById('perkInput' + i);
            if (inp.value.trim()) { tiers[i].perks.push(inp.value.trim()); inp.value = ''; renderTiers(); }
        };
        document.getElementById('addTierBtn').addEventListener('click', () => { tiers.push({ name: '', price: '', perks: [] }); renderTiers(); });
        // Start with one tier
        tiers.push({ name: 'Title Sponsor', price: '', perks: [] });
        renderTiers();

        function getEventData() {
            return {
                id: genId(), institutionId: user.id, eventName: document.getElementById('eventName').value.trim(),
                type: document.getElementById('eventType').value, date: document.getElementById('eventDate').value,
                venue: document.getElementById('venue').value.trim(), footfall: parseInt(document.getElementById('footfall').value) || 0,
                city: document.getElementById('city').value.trim(), targetAudience: document.getElementById('targetAudience').value.trim(),
                description: document.getElementById('description').value.trim(), tiers: tiers.filter(t => t.name),
                status: 'published', views: 0, saves: 0, interests: 0, collegeTier: user.tier || '',
                budgetRange: tiers.length > 0 ? tiers[tiers.length - 1].price + ' – ' + tiers[0].price : '', createdAt: new Date().toISOString().split('T')[0]
            };
        }
        document.getElementById('eventForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const evt = getEventData();
            AppState.push('events', evt);
            showToast('Event published successfully! 🎉');
            setTimeout(() => window.location.href = '/institution/dashboard.html', 800);
        });
        document.getElementById('previewBtn').addEventListener('click', () => {
            const evt = getEventData();
            AppState.set('brochurePreview', { ...evt, collegeName: user.collegeName, collegeTier: user.tier, studentStrength: user.studentStrength, contactPerson: user.contactPerson, email: user.email });
            window.open('/brochure/brochure.html', '_blank');
        });
    </script>
</body>

</html>
