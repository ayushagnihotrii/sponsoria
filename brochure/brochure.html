<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsorship Brochure — Sponsoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #3B82F6;
            --purple: #8B5CF6;
            --green: #22C55E;
            --font: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: #fff;
            color: #0F172A;
            line-height: 1.6;
        }

        .brochure {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }

        .brochure-header {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #EFF6FF, #F5F3FF);
            border-radius: 20px;
            margin-bottom: 32px;
        }

        .brochure-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: #64748B;
            margin-bottom: 16px;
        }

        .brochure-logo .mark {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: .7rem;
        }

        .brochure-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .brochure-college {
            font-size: 1.1rem;
            color: #475569;
            margin-bottom: 16px;
        }

        .brochure-meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: .88rem;
            color: #64748B;
        }

        .brochure-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #E2E8F0;
        }

        .section p {
            font-size: .92rem;
            color: #475569;
        }

        .tier-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .tier-table th {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
            padding: 12px 16px;
            text-align: left;
            font-size: .85rem;
        }

        .tier-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #E2E8F0;
            font-size: .88rem;
        }

        .tier-table tr:nth-child(even) {
            background: #F8FAFC;
        }

        .tier-table .perks {
            font-size: .8rem;
            color: #64748B;
        }

        .contact-box {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .contact-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .contact-box p {
            font-size: .88rem;
            color: #475569;
        }

        .download-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #E2E8F0;
            padding: 14px 24px;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }

        .download-bar button {
            padding: 10px 24px;
            border-radius: 999px;
            font-family: var(--font);
            font-weight: 600;
            font-size: .88rem;
            cursor: pointer;
            border: none;
        }

        .btn-dl {
            background: var(--primary);
            color: #fff;
        }

        .btn-dl:hover {
            background: #2563EB;
        }

        .btn-back {
            background: #F1F5F9;
            color: #475569;
            border: 1px solid #E2E8F0;
        }

        @media print {
            .download-bar {
                display: none !important;
            }

            .brochure {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="brochure" id="brochure"></div>
    <div class="download-bar no-print">
        <button class="btn-dl" onclick="window.print()"><i class="fa-solid fa-download"></i> Download as PDF</button>
        <button class="btn-back" onclick="window.close()"><i class="fa-solid fa-arrow-left"></i> Back</button>
    </div>
    <script>
        // Load from localStorage
        const data = JSON.parse(localStorage.getItem('sponsoria_brochurePreview') || 'null');
        const el = document.getElementById('brochure');
        if (!data) { el.innerHTML = '<div style="text-align:center;padding:60px;color:#94A3B8;"><h2>No event data</h2><p>Please generate a brochure from the Create Event page.</p></div>'; }
        else {
            const tiersHtml = (data.tiers || []).map(t => `<tr><td><strong>${t.name}</strong></td><td>${t.price}</td><td class="perks">${(t.perks || []).join(', ') || '—'}</td></tr>`).join('');
            el.innerHTML = `
        <div class="brochure-header">
          <div class="brochure-logo"><div class="mark"><i class="fa-solid fa-bolt"></i></div> Sponsoria</div>
          <h1 class="brochure-title">${data.eventName || 'Event Name'}</h1>
          <p class="brochure-college">${data.collegeName || 'Institution'} ${data.collegeTier ? '· ' + data.collegeTier : ''}</p>
          <div class="brochure-meta">
            <span><i class="fa-regular fa-calendar"></i> ${data.date ? new Date(data.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }) : 'TBD'}</span>
            <span><i class="fa-solid fa-location-dot"></i> ${data.venue || 'Venue TBD'}, ${data.city || ''}</span>
            <span><i class="fa-solid fa-users"></i> ${(data.footfall || 0).toLocaleString()} expected</span>
          </div>
        </div>
        <div class="section">
          <h2>About the Event</h2>
          <p>${data.description || 'An exciting campus event looking for sponsors to create an unforgettable experience.'}</p>
        </div>
        <div class="section">
          <h2>Event Details</h2>
          <p><strong>Type:</strong> ${data.type || '—'}<br><strong>Target Audience:</strong> ${data.targetAudience || '—'}<br><strong>Student Strength:</strong> ${(data.studentStrength || 0).toLocaleString()}</p>
        </div>
        <div class="section">
          <h2>Sponsorship Tiers</h2>
          ${tiersHtml ? `<table class="tier-table"><thead><tr><th>Tier</th><th>Investment</th><th>Perks Included</th></tr></thead><tbody>${tiersHtml}</tbody></table>` : '<p>Sponsorship packages available upon request.</p>'}
        </div>
        <div class="contact-box">
          <h3>Interested in Sponsoring?</h3>
          <p><strong>${data.contactPerson || 'Contact Person'}</strong><br>${data.email || ''}<br>Visit <strong>sponsoria.in</strong> to express interest directly!</p>
        </div>
      `;
        }
    </script>
</body>

</html>
