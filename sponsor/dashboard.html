<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsor Dashboard — Sponsoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/shared.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebarContainer"></div>
        <div class="main-content">
            <div id="topbarContainer"></div>
            <div class="page-content">
                <h1 class="page-title">Sponsor Dashboard</h1>
                <p class="page-subtitle" id="welcomeMsg">Welcome back!</p>
                <div class="stats-row" id="statsRow"></div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('deals')">Deal Tracker</button>
                    <button class="tab-btn" onclick="showTab('saved')">Saved Events</button>
                    <button class="tab-btn" onclick="showTab('notifs')">Notifications</button>
                    <button class="tab-btn" onclick="showTab('roi')">ROI Reports</button>
                </div>
                <div id="tabDeals"></div>
                <div id="tabSaved" style="display:none;"></div>
                <div id="tabNotifs" style="display:none;"></div>
                <div id="tabRoi" style="display:none;"></div>
                <div class="btn-group" style="margin-top:24px;">
                    <a href="/sponsor/discover.html" class="btn-primary"><i class="fa-solid fa-compass"></i> Discover
                        Events</a>
                    <a href="/sponsor/messages.html" class="btn-secondary"><i class="fa-solid fa-message"></i>
                        Messages</a>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/shared.js"></script>
    <script>
        if (!Session.require('sponsor')) throw '';
        const user = Session.get();
        document.getElementById('sidebarContainer').innerHTML = renderSidebar('dashboard');
        document.getElementById('topbarContainer').innerHTML = renderTopbar();
        initSidebarEvents();
        document.getElementById('welcomeMsg').textContent = `Welcome back, ${user.companyName}!`;
        const interests = (AppState.get('interests') || []).filter(i => i.sponsorId === user.id);
        const bookmarks = (AppState.get('bookmarks') || []).filter(b => b.sponsorId === user.id);
        const closedDeals = interests.filter(i => i.status === 'closed');
        document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="stat-icon" style="background:#DBEAFE;color:#2563EB;"><i class="fa-solid fa-compass"></i></div><div class="stat-value">${(AppState.get('events') || []).length}</div><div class="stat-label">Events Discovered</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#FFF7ED;color:#F97316;"><i class="fa-solid fa-handshake"></i></div><div class="stat-value">${interests.length}</div><div class="stat-label">Interest Expressed</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#F0FDF4;color:#22C55E;"><i class="fa-solid fa-circle-check"></i></div><div class="stat-value">${closedDeals.length}</div><div class="stat-label">Deals Closed</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#F5F3FF;color:#8B5CF6;"><i class="fa-solid fa-bookmark"></i></div><div class="stat-value">${bookmarks.length}</div><div class="stat-label">Saved Events</div></div>
    `;
        // Deals tab
        const dealsEl = document.getElementById('tabDeals');
        if (interests.length === 0) { dealsEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-handshake"></i><p>No deals yet. Start discovering events!</p></div>'; }
        else {
            dealsEl.innerHTML = `<div class="form-card" style="padding:0;overflow:hidden;"><table class="data-table"><thead><tr><th>Event</th><th>Status</th><th>Date</th><th>Amount</th></tr></thead><tbody>${interests.map(i => `<tr><td><strong>${i.eventName}</strong></td><td><span class="badge ${i.status === 'closed' ? 'badge-green' : i.status === 'in-talks' ? 'badge-blue' : 'badge-orange'}">${i.status}</span></td><td>${formatDate(i.expressedAt)}</td><td>${i.dealAmount || '—'}</td></tr>`).join('')}</tbody></table></div>`;
        }
        // Saved tab
        const savedEl = document.getElementById('tabSaved');
        const events = AppState.get('events') || [];
        const savedEvents = bookmarks.map(b => events.find(e => e.id === b.eventId)).filter(Boolean);
        if (savedEvents.length === 0) { savedEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-bookmark"></i><p>No saved events. Browse and save events you like!</p></div>'; }
        else {
            savedEl.innerHTML = '<div class="card-grid">' + savedEvents.map(e => `<div class="event-card"><div class="event-card-header"><div><div class="event-card-title">${e.eventName}</div><div class="event-card-org">${e.type} · ${e.city}</div></div></div><div class="event-card-meta"><span class="event-meta-tag"><i class="fa-regular fa-calendar"></i> ${formatDate(e.date)}</span><span class="event-meta-tag"><i class="fa-solid fa-users"></i> ${(e.footfall || 0).toLocaleString()}</span></div><div class="event-card-footer"><span class="event-card-budget">${e.budgetRange || ''}</span><a href="/sponsor/discover.html" class="btn-primary" style="padding:6px 14px;font-size:.8rem;">View</a></div></div>`).join('') + '</div>';
        }
        // Notifications tab
        const notifs = Notifications.getForUser(user.id);
        const notifsEl = document.getElementById('tabNotifs');
        if (notifs.length === 0) { notifsEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-bell-slash"></i><p>No notifications yet</p></div>'; }
        else { notifsEl.innerHTML = '<div class="notif-list">' + notifs.map(n => `<div class="notif-item ${n.read ? '' : 'unread'}"><div class="notif-icon" style="background:${n.type === 'success' ? 'var(--green-light)' : 'var(--primary-light)'};color:${n.type === 'success' ? 'var(--green)' : 'var(--primary)'};"><i class="fa-solid ${n.type === 'success' ? 'fa-circle-check' : 'fa-bell'}"></i></div><div class="notif-text">${n.message}</div><div class="notif-time">${timeAgo(n.time)}</div></div>`).join('') + '</div>'; }
        // ROI tab
        const reports = (AppState.get('reports') || []);
        const myEventIds = interests.map(i => i.eventId);
        const myReports = reports.filter(r => myEventIds.includes(r.eventId));
        const roiEl = document.getElementById('tabRoi');
        if (myReports.length === 0) { roiEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-chart-line"></i><p>No post-event reports available yet</p></div>'; }
        else { roiEl.innerHTML = myReports.map(r => `<div class="form-card"><h3 style="margin-bottom:12px;">${r.eventName}</h3><div class="stats-row" style="margin-bottom:14px;"><div class="stat-card"><div class="stat-value">${(r.attendance || 0).toLocaleString()}</div><div class="stat-label">Attendance</div></div><div class="stat-card"><div class="stat-value">${r.socialReach || '—'}</div><div class="stat-label">Social Reach</div></div></div><p style="font-size:.88rem;color:var(--text-secondary);">${r.impactSummary || ''}</p>${r.pressCoverage ? `<p style="font-size:.82rem;margin-top:8px;"><strong>Press:</strong> ${r.pressCoverage}</p>` : ''}</div>`).join(''); }
        window.showTab = function (tab) {
            ['deals', 'saved', 'notifs', 'roi'].forEach(t => {
                document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = t === tab ? '' : 'none';
            });
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', ['deals', 'saved', 'notifs', 'roi'][i] === tab));
        };
    </script>
</body>

</html>
