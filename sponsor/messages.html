<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Sponsoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/shared.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebarContainer"></div>
        <div class="main-content">
            <div id="topbarContainer"></div>
            <div class="page-content">
                <h1 class="page-title" style="margin-bottom:16px;">Messages</h1>
                <div class="msg-layout">
                    <div class="msg-sidebar">
                        <div class="msg-sidebar-header">Conversations</div>
                        <div id="threadList"></div>
                    </div>
                    <div class="msg-chat" id="chatPanel">
                        <div class="msg-chat-header" id="chatHeader"><i class="fa-solid fa-message"
                                style="color:var(--text-muted);"></i> Select a conversation</div>
                        <div class="msg-chat-body" id="chatBody">
                            <div class="empty-state"><i class="fa-solid fa-comments"></i>
                                <p>Choose a conversation to start messaging</p>
                            </div>
                        </div>
                        <div class="msg-input-area" id="inputArea" style="display:none;">
                            <input type="text" id="msgInput" placeholder="Type a message...">
                            <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i> Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/shared.js"></script>
    <script>
        if (!Session.isLoggedIn()) { window.location.href = '/auth/login.html'; throw ''; }
        const user = Session.get();
        const isInst = user.role === 'institution';
        document.getElementById('sidebarContainer').innerHTML = renderSidebar('messages');
        document.getElementById('topbarContainer').innerHTML = renderTopbar();
        initSidebarEvents();
        let activeThread = null;
        function getThreads() {
            const msgs = AppState.get('messages') || [];
            const threads = {};
            msgs.forEach(m => {
                const otherId = m.fromId === user.id ? m.toId : (m.toId === user.id ? m.fromId : null);
                if (!otherId) return;
                const otherName = m.fromId === user.id ? m.toName : m.fromName;
                if (!threads[otherId]) threads[otherId] = { id: otherId, name: otherName, lastMessage: m.text, lastTime: m.time, messages: [] };
                threads[otherId].messages.push(m);
                if (m.time > threads[otherId].lastTime) { threads[otherId].lastMessage = m.text; threads[otherId].lastTime = m.time; }
            });
            return Object.values(threads).sort((a, b) => new Date(b.lastTime) - new Date(a.lastTime));
        }
        function renderThreads() {
            const threads = getThreads();
            const el = document.getElementById('threadList');
            if (threads.length === 0) { el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.85rem;">No conversations yet</div>'; return; }
            el.innerHTML = threads.map(t => `
        <div class="msg-thread-item ${activeThread === t.id ? 'active' : ''}" onclick="openThread('${t.id}','${t.name.replace(/'/g, "\\'")}')">
          <div class="msg-thread-avatar">${t.name.charAt(0)}</div>
          <div class="msg-thread-info"><div class="msg-thread-name">${t.name}</div><div class="msg-thread-preview">${t.lastMessage}</div></div>
        </div>`).join('');
        }
        window.openThread = function (otherId, otherName) {
            activeThread = otherId;
            renderThreads();
            const msgs = (AppState.get('messages') || []).filter(m => (m.fromId === user.id && m.toId === otherId) || (m.fromId === otherId && m.toId === user.id)).sort((a, b) => new Date(a.time) - new Date(b.time));
            document.getElementById('chatHeader').innerHTML = `<div class="msg-thread-avatar" style="width:32px;height:32px;font-size:.75rem;">${otherName.charAt(0)}</div> ${otherName}`;
            const body = document.getElementById('chatBody');
            body.innerHTML = msgs.map(m => `<div class="msg-bubble ${m.fromId === user.id ? 'sent' : 'received'}"><div>${m.text}</div><div class="bubble-time">${new Date(m.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</div></div>`).join('');
            body.scrollTop = body.scrollHeight;
            document.getElementById('inputArea').style.display = '';
            document.getElementById('msgInput').focus();
        };
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !activeThread) return;
            const threads = getThreads();
            const thread = threads.find(t => t.id === activeThread);
            const otherName = thread?.name || 'User';
            const myName = isInst ? user.collegeName : user.companyName;
            const msg = { id: genId(), fromId: user.id, toId: activeThread, fromName: myName, toName: otherName, text, time: new Date().toISOString(), read: false };
            AppState.push('messages', msg);
            input.value = '';
            openThread(activeThread, otherName);
            renderThreads();
        }
        renderThreads();
        // Auto-open first thread if exists
        const threads = getThreads();
        if (threads.length > 0) openThread(threads[0].id, threads[0].name);
    </script>
</body>

</html>
