<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sponsoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #EFF6FF 0%, #F5F3FF 50%, #FFF7ED 100%); }
    .auth-container { width: 100%; max-width: 460px; padding: 20px; }
    .auth-card { background: var(--bg-white); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); padding: 40px 36px; border: 1px solid var(--border); }
    .auth-logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
    .auth-logo .logo-mark { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--purple)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.1rem; }
    .auth-subtitle { text-align: center; font-size: .88rem; color: var(--text-secondary); margin-bottom: 28px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: .85rem; color: var(--text-secondary); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; font-size: .78rem; color: var(--text-muted); }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .demo-box { background: var(--accent-light); border: 1px solid #FFEDD5; border-radius: var(--radius-md); padding: 14px 16px; margin-top: 16px; font-size: .78rem; color: var(--accent); }
    .demo-box strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><div class="logo-mark"><i class="fa-solid fa-bolt"></i></div> Sponsoria</div>
      <p class="auth-subtitle">Welcome back! Login to your account.</p>
      <div class="role-toggle" style="margin: 0 auto 24px;">
        <button class="role-toggle-btn active" data-role="institution"><i class="fa-solid fa-school"></i> Institution</button>
        <button class="role-toggle-btn" data-role="sponsor"><i class="fa-solid fa-building"></i> Sponsor</button>
      </div>
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="your@college.ac.in" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter password" required></div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      </form>
      <div class="divider">or</div>
      <div class="auth-footer">Don't have an account? <a href="/auth/register.html">Register here</a></div>
      <div class="auth-footer" style="margin-top:8px;"><a href="/">← Back to Home</a></div>
      <div class="demo-box">
        <strong>🔑 Demo Credentials</strong>
        <span id="demoHint">Institution: tech@iitpune.ac.in / demo</span>
      </div>
    </div>
  </div>
  <script src="/js/shared.js"></script>
  <script>
    let role = 'institution';
    document.querySelectorAll('.role-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        role = btn.dataset.role;
        document.getElementById('email').placeholder = role === 'institution' ? 'your@college.ac.in' : 'you@company.com';
        document.getElementById('demoHint').textContent = role === 'institution' ? 'Institution: tech@iitpune.ac.in / demo' : 'Sponsor: marketing@pepsi.com / demo';
      });
    });
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const list = AppState.get(role === 'institution' ? 'institutions' : 'sponsors') || [];
      const user = list.find(u => u.email === email && u.password === pass);
      if (user) {
        Session.login(user);
        showToast('Login successful!');
        setTimeout(() => { window.location.href = role === 'institution' ? '/institution/dashboard.html' : '/sponsor/dashboard.html'; }, 500);
      } else { showToast('Invalid email or password', 'error'); }
    });
    if (Session.isLoggedIn()) window.location.href = Session.role() === 'institution' ? '/institution/dashboard.html' : '/sponsor/dashboard.html';
  </script>
</body>
</html>
